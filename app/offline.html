<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Amsterdam Guestlist Service</title>
<style>
@font-face{ font-family:"CG"; src:url("fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); font-weight:600; }
html,body{ margin:0; height:100%; background:#050505; color:#F2F2F2; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
body{ display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; text-align:center;
  background:radial-gradient(ellipse at 50% 35%, rgba(201,162,74,.18), transparent 60%), #050505; }
.wrap{ max-width:340px; }
img{ width:96px; height:96px; border-radius:50%; box-shadow:0 0 50px rgba(201,162,74,.45); }
h1{ font-family:"CG",Georgia,serif; font-weight:600; font-size:34px; line-height:1.1; margin:26px 0 10px; color:#fff; }
p{ color:#BDBDBD; font-size:15px; line-height:1.6; margin:0 0 28px; }
button{ width:100%; min-height:50px; border:0; background:#C9A24A; color:#000; font:700 13px/1 -apple-system,Helvetica,Arial,sans-serif; letter-spacing:.18em; text-transform:uppercase; box-shadow:0 0 26px -8px rgba(201,162,74,.8); }
button:active{ transform:scale(.98); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="icon-192.png" alt="AGS">
    <h1>You're offline</h1>
    <p>Amsterdam Guestlist Service needs an internet connection to show tonight's events and your guestlist. Check your connection and try again.</p>
    <button type="button" onclick="location.href='https://www.amsterdamguestlistservice.website/app/'">Try again</button>
  </div>
</body>
</html>
