<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guestlist Requests — AGS</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --black:#050505; --charcoal:#0D0D0D; --gold:#C9A24A; --gold-light:#E6C875;
  --white:#F5F5F5; --muted:#A6A6A6; --line: rgba(201,162,74,0.22);
  --green:#5FBF7A; --red:#C9605A;
}
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; background:var(--black); color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  padding:24px 16px 60px;
}
.wrap{ max-width:640px; margin:0 auto; }
h1{ font-size:20px; margin:0 0 4px; font-weight:600; }
p.sub{ font-size:12.5px; color:var(--muted); margin:0 0 22px; }

/* ---- password gate ---- */
.gate{ max-width:360px; margin:80px auto; background:var(--charcoal); border:1px solid var(--line); padding:26px; }
.gate label{ display:block; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.gate input{ width:100%; padding:11px 12px; background:#000; border:1px solid var(--line); color:var(--white); font-size:14px; }
.gate button{ width:100%; margin-top:16px; padding:12px; background:var(--gold); color:var(--black); border:none; font-weight:700; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; }
.gate .err{ color:var(--red); font-size:12.5px; margin-top:10px; display:none; }

/* ---- filter tabs ---- */
.tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
.tabs button{
  padding:8px 14px; background:none; border:1px solid var(--line); color:var(--muted);
  font-size:11.5px; letter-spacing:0.04em; cursor:pointer;
}
.tabs button.is-active{ border-color:var(--gold); color:var(--gold-light); }

/* ---- request cards ---- */
.card{ border:1px solid var(--line); background:var(--charcoal); padding:16px; margin-bottom:12px; }
.card__top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; }
.card__event{ font-size:15px; font-weight:600; }
.card__meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
.card__status{
  flex-shrink:0; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase;
  padding:4px 9px; border:1px solid var(--gold); color:var(--gold-light); white-space:nowrap;
}
.card__status.is-approved{ border-color:var(--green); color:var(--green); }
.card__status.is-declined{ border-color:var(--red); color:var(--red); }
.card__details{ font-size:12.5px; color:var(--white); line-height:1.7; margin-bottom:12px; }
.card__details span{ color:var(--muted); }
.card__actions{ display:flex; gap:8px; }
.card__actions button{
  flex:1; padding:10px; border:1px solid var(--line); background:none; color:var(--white);
  font-size:11px; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;
}
.card__actions button.approve{ border-color:var(--green); color:var(--green); }
.card__actions button.approve.is-current{ background:var(--green); color:#08150c; }
.card__actions button.decline{ border-color:var(--red); color:var(--red); }
.card__actions button.decline.is-current{ background:var(--red); color:#1a0808; }
.card__actions button:disabled{ opacity:0.4; cursor:default; }

.empty{ text-align:center; color:var(--muted); font-size:13px; padding:50px 10px; }
.loading{ text-align:center; color:var(--muted); font-size:13px; padding:50px 10px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="gate" id="gate">
    <label for="secret">Password</label>
    <input type="password" id="secret" autocomplete="off">
    <button type="button" id="unlockBtn">Unlock</button>
    <div class="err" id="gateErr">Incorrect password, or something went wrong.</div>
  </div>

  <div id="dashboard" style="display:none;">
    <h1>Guestlist Requests</h1>
    <p class="sub">Tap Approve or Decline — updates instantly, no page reload.</p>

    <div class="tabs" id="tabs">
      <button type="button" class="is-active" data-filter="Pending">Pending</button>
      <button type="button" data-filter="Approved">Approved</button>
      <button type="button" data-filter="Declined">Declined</button>
      <button type="button" data-filter="All">All</button>
    </div>

    <div id="list"></div>
  </div>

</div>

<script>
let SECRET = '';
let ALL_REQUESTS = [];
let CURRENT_FILTER = 'Pending';

const gate = document.getElementById('gate');
const dashboard = document.getElementById('dashboard');
const listEl = document.getElementById('list');

document.getElementById('unlockBtn').addEventListener('click', unlock);
document.getElementById('secret').addEventListener('keydown', function(e){
  if(e.key === 'Enter') unlock();
});

async function unlock(){
  const val = document.getElementById('secret').value.trim();
  if(!val) return;
  SECRET = val;
  const errEl = document.getElementById('gateErr');
  errEl.style.display = 'none';
  try{
    await loadRequests();
    gate.style.display = 'none';
    dashboard.style.display = 'block';
  } catch(err){
    errEl.textContent = err.message || 'Incorrect password, or something went wrong.';
    errEl.style.display = 'block';
  }
}

async function loadRequests(){
  listEl.innerHTML = '<div class="loading">Loading requests…</div>';
  const res = await fetch('/api/admin-requests', {
    headers: { 'x-notify-secret': SECRET }
  });
  const data = await res.json();
  if(!res.ok){ throw new Error(data.error || 'Failed to load requests'); }
  ALL_REQUESTS = data.requests || [];
  render();
}

document.getElementById('tabs').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-filter]');
  if(!btn) return;
  CURRENT_FILTER = btn.dataset.filter;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('is-active', b === btn));
  render();
});

function formatDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function render(){
  const filtered = CURRENT_FILTER === 'All'
    ? ALL_REQUESTS
    : ALL_REQUESTS.filter(r => (r.status || 'Pending') === CURRENT_FILTER);

  if(!filtered.length){
    listEl.innerHTML = '<div class="empty">No ' + (CURRENT_FILTER === 'All' ? '' : CURRENT_FILTER.toLowerCase() + ' ') + 'requests.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(function(r){
    const status = r.status || 'Pending';
    const statusClass = status === 'Approved' ? 'is-approved' : status === 'Declined' ? 'is-declined' : '';
    const extraGuests = r.total_guests && r.total_guests > 1 ? (r.total_guests + ' total guests') : '1 guest';

    return (
      '<div class="card" data-id="' + r.id + '">' +
        '<div class="card__top">' +
          '<div>' +
            '<div class="card__event">' + escapeHtml(r.event_name || '') + '</div>' +
            '<div class="card__meta">' + escapeHtml(r.event_venue || '') + ' · ' + formatDate(r.event_date) + '</div>' +
          '</div>' +
          '<span class="card__status ' + statusClass + '">' + status + '</span>' +
        '</div>' +
        '<div class="card__details">' +
          '<span>Guest:</span> ' + escapeHtml(r.first_name || '') + ' ' + escapeHtml(r.last_name || '') + (r.age ? ' (' + escapeHtml(r.age) + ')' : '') + '<br>' +
          (r.instagram ? '<span>Instagram:</span> ' + escapeHtml(r.instagram) + '<br>' : '') +
          (r.phone ? '<span>Phone:</span> ' + escapeHtml(r.phone) + '<br>' : '') +
          (r.email ? '<span>Email:</span> ' + escapeHtml(r.email) + '<br>' : '') +
          renderAdditionalGuests(r.additional_guests) +
          '<span>Party size:</span> ' + extraGuests +
        '</div>' +
        '<div class="card__actions">' +
          '<button type="button" class="approve' + (status === 'Approved' ? ' is-current' : '') + '" data-action="Approved">Approve</button>' +
          '<button type="button" class="decline' + (status === 'Declined' ? ' is-current' : '') + '" data-action="Declined">Decline</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(ch){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
  });
}

function renderAdditionalGuests(additionalGuests){
  let guests = additionalGuests;
  // Supabase may return jsonb as a string or an already-parsed array/object.
  if(typeof guests === 'string'){
    try{ guests = JSON.parse(guests); } catch(e){ guests = null; }
  }
  if(!guests || !Array.isArray(guests) || !guests.length) return '';

  const lines = guests.map(function(g, i){
    const name = [g.firstName, g.lastName].filter(Boolean).join(' ') || ('Guest ' + (i + 2));
    return (i + 2) + '. ' + escapeHtml(name) + (g.age ? ' (' + escapeHtml(g.age) + ')' : '');
  });
  return '<span>Additional guests:</span><br>' + lines.join('<br>') + '<br>';
}

listEl.addEventListener('click', async function(e){
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const card = btn.closest('.card');
  const id = card.dataset.id;
  const newStatus = btn.dataset.action;

  const actionButtons = card.querySelectorAll('button[data-action]');
  actionButtons.forEach(b => b.disabled = true);

  try{
    const res = await fetch('/api/admin-requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-notify-secret': SECRET },
      body: JSON.stringify({ id: id, status: newStatus })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.error || 'Update failed'); }

    const req = ALL_REQUESTS.find(r => String(r.id) === String(id));
    if(req){ req.status = newStatus; }
    render();
  } catch(err){
    alert(err.message || 'Something went wrong.');
    actionButtons.forEach(b => b.disabled = false);
  }
});
</script>
</body>
</html>
